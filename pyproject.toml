[project]
name = "talos"
version = "0.1.0"
description = "One-window tabbed playground of cellular automata and toys"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
